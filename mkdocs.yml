site_name: The Brown Family Kitchen
site_description: Brown family recipes, notes, and kitchen traditions
site_url: https://jasonb815.github.io/brown-family-kitchen/
repo_url: https://github.com/jasonb815/brown-family-kitchen
repo_name: jasonb815/brown-family-kitchen

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

hooks:
  - hooks/badges.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Recipes:
      - Beef:
          - Crockpot French Onion Meatballs: recipes/beef/crockpot-french-onion-meatballs.md
      - Desserts:
          - Gluten-Free Coconut Cream Cake: recipes/desserts/gluten-free-coconut-cream-cake.md
      - Drinks:
          - Fire Cider: recipes/drinks/fire-cider.md
          - Peach Pecan Infused Bourbon: recipes/drinks/peach-pecan-infused-bourbon.md
      - Snacks:
          - Frozen Banana Yogurt Pops: recipes/snacks/frozen-banana-yogurt-pops.md
      - Soups:
          - Hamburger Vegetable Soup: recipes/soups/hamburger-vegetable-soup.md
  - About: about.md
