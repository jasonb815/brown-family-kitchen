site_name: The Brown Family Kitchen
site_description: Brown family recipes, notes, and kitchen traditions
site_url: https://jasonb815.github.io/brown-family-kitchen/
repo_url: https://github.com/jasonb815/brown-family-kitchen
repo_name: jasonb815/brown-family-kitchen

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - glightbox

hooks:
  - hooks/badges.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Browse:
      - By Status: browse/by-status.md
      - Favorites: browse/favorites.md
  - Recipes:
      - Beef:
          - Crockpot French Onion Meatballs: recipes/beef/crockpot-french-onion-meatballs.md
      - Cookies:
          - 100 Grands: recipes/cookies/100-grands.md
          - 3-Ingredient Shortbread Cookies: recipes/cookies/3-ingredient-shortbread-cookies.md
          - Almond Joy Cookies: recipes/cookies/almond-joy-cookies.md
          - Calypso Cookies: recipes/cookies/calypso-cookies.md
          - Chocolate Oatmeal Cookies (No-Bake): recipes/cookies/chocolate-oatmeal-cookies-no-bake.md
          - Christmas Crack Cookies: recipes/cookies/christmas-crack-cookies.md
          - Mimi's Peppermint Bark: recipes/cookies/mimis-peppermint-bark.md
          - Mini Pecan Pie Bites: recipes/cookies/mini-pecan-pie-bites.md
          - Paleo Chocolate Crinkle Cookies: recipes/cookies/paleo-chocolate-crinkle-cookies.md
          - Reindeer Poop: recipes/cookies/reindeer-poop.md
          - Salty-Sweet Peanut Butter Sandies: recipes/cookies/salty-sweet-peanut-butter-sandies.md
          - Sugar Cookies (Cut-Out): recipes/cookies/sugar-cookies-cut-out.md
          - Sweet Potato Cheesecake Squares: recipes/cookies/sweet-potato-cheesecake-squares.md
      - Desserts:
          - Chocolate Delight: recipes/desserts/chocolate-delight.md
          - Gluten-Free Coconut Cream Cake: recipes/desserts/gluten-free-coconut-cream-cake.md
      - Drinks:
          - Fire Cider: recipes/drinks/fire-cider.md
          - Peach Pecan Infused Bourbon: recipes/drinks/peach-pecan-infused-bourbon.md
      - Poultry:
          - Alton Brown's Brined Turkey: recipes/poultry/alton-browns-brined-turkey.md
      - Snacks:
          - Frozen Banana Yogurt Pops: recipes/snacks/frozen-banana-yogurt-pops.md
      - Soups:
          - Hamburger Vegetable Soup: recipes/soups/hamburger-vegetable-soup.md
          - Grandpa's Chili: recipes/soups/grandpas-chili.md
  - About: about.md
